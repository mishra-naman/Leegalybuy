<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#34465b" />
    <meta
      name="description"
      content="Browse, filter and explore products with Leegalybuy, a Leegality frontend assessment."
    />
    <title>Leegalybuy · Product catalogue</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('leegalybuy-theme') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
